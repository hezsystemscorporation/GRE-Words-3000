n": "1. reduced from a state of wildness; 2. keep from exceeding"}, {"w": "tangle", "uk": "[ˈtæŋg(ə)l]", "us": "[ˈtæŋɡl]", "cn": "纠缠，使…纠结", "pos": "v.纠缠，使…纠结", "en": "seize as if in snare"}, {"w": "teeming", "uk": "[ˈtiːmɪŋ]", "us": "[ˈtiːmɪŋ]", "cn": "大量的", "pos": "adj.大量的", "en": "covered with great numbers"}, {"w": "temporal", "uk": "[ˈtemp(ə)r(ə)l]", "us": "[ˈtɛmpərəl]", "cn": "世俗的，尘世的", "pos": "adj.世俗的，尘世的", "en": "of earthly life"}, {"w": "tentative", "uk": "[ˈtentətɪv]", "us": "[ˈtɛntətɪv]", "cn": "暂时性的，尝试的", "pos": "adj.暂时性的，尝试的", "en": "not fully developed"}, {"w": "thick-skinned", "uk": "thick-skinned", "us": "thick-skinned", "cn": "冷漠无情的，不顾及他人感受的", "pos": "adj.冷漠无情的，不顾及他人感受的", "en": "largely unaffected by the feelings of other people"}, {"w": "thrill", "uk": "[θrɪl]", "us": "[θrɪl]", "cn": "强烈的兴奋感，快感；使兴奋，使激动", "pos": "n.强烈的兴奋感，快感；v.使兴奋，使激动", "en": "1. a pleasurably intense stimulation; 2. cause excitement"}, {"w": "timely", "uk": "[ˈtaɪmlɪ]", "us": "[ˈtaɪmli]", "cn": "恰到好处的，合乎时宜的", "pos": "adj.恰到好处的，合乎时宜的", "en": "appropriate"}, {"w": "trifling", "uk": "[ˈtraɪflɪŋ]", "us": "[ˈtraɪflɪŋ]", "cn": "细微的，不重要的", "pos": "adj.细微的，不重要的", "en": "lacking in significance"}, {"w": "tycoon", "uk": "[taɪˈkuːn]", "us": "[taɪˈkun]", "cn": "大亨，巨头", "pos": "n.大亨，巨头", "en": "a person of rank, power, or influence"}, {"w": "tyrant", "uk": "[ˈtaɪr(ə)nt]", "us": "[ˈtaɪrənt]", "cn": "暴君", "pos": "n.暴君", "en": "a brutal ruler"}, {"w": "umbrage", "uk": "[ˈʌmbrɪdʒ]", "us": "[ˈʌmbrɪdʒ]", "cn": "不悦，生气", "pos": "n.不悦，生气", "en": "being affended"}, {"w": "unanimous", "uk": "[juːˈnænɪməs]", "us": "[jʊˈnænəməs]", "cn": "一致同意的", "pos": "adj.一致同意的", "en": "having the consent of all"}, {"w": "unavailing", "uk": "[ˌʌnəˈveɪlɪŋ]", "us": "[ˌʌnəˈveɪlɪŋ]", "cn": "徒劳的，无果的", "pos": "adj.徒劳的，无果的", "en": "producing no results"}, {"w": "unremitting", "uk": "[ˌʌnrɪˈmɪtɪŋ]", "us": "[ˌʌnrɪˈmɪtɪŋ]", "cn": "连续不断的", "pos": "adj.连续不断的", "en": "going on without any interruptions"}, {"w": "vouchsafe", "uk": "[ˌvaʊtʃˈseɪf]", "us": "[ˌvaʊtʃˈseɪf]", "cn": "允诺，给予", "pos": "v.允诺，给予", "en": "grant in a gracious manner"}, {"w": "wayward", "uk": "[ˈweɪwəd]", "us": "[ˈwewəd]", "cn": "刚愎自用的，不服管束的", "pos": "adj.刚愎自用的，不服管束的", "en": "following one's own inclinations"}, {"w": "weather", "uk": "[ˈweðə]", "us": "[ˈwɛðə]", "cn": "经受住", "pos": "v.经受住", "en": "come through safely"}, {"w": "willful", "uk": "[ˈwɪlfʊl]", "us": "[ˈwɪlfəl]", "cn": "固执的，倔强的", "pos": "adj.固执的，倔强的", "en": "obstinately and self-willed"}, {"w": "willy-nilly", "uk": "[ˌwɪliˈnɪli]", "us": "[ˌwɪliˈnɪli]", "cn": "无秩序的，随意的", "pos": "adj.无秩序的，随意的", "en": "without order"}, {"w": "wilt", "uk": "[wɪlt]", "us": "[wɪlt]", "cn": "精神萎靡，憔悴", "pos": "v.精神萎靡，憔悴", "en": "feel fatigue and exhaustion"}, {"w": "wily", "uk": "[ˈwaɪli]", "us": "[ˈwaɪli]", "cn": "狡诈的，狡猾的", "pos": "adj.狡诈的，狡猾的", "en": "deceptive and cunning"}, {"w": "wiretap", "uk": "[ˈwaɪətæp]", "us": "[ˈwaɪətæp]", "cn": "偷听，窃听", "pos": "n./vt.偷听，窃听", "en": "tap a telephone in order to get information"}, {"w": "wistful", "uk": "[ˈwɪs(t)fʊl]", "us": "[ˈwɪstfl]", "cn": "渴望的，怀念的", "pos": "adj.渴望的，怀念的", "en": "full of yearning or desire"}, {"w": "wrest", "uk": "[rest]", "us": "[rest]", "cn": "辛苦地获得", "pos": "v.辛苦地获得", "en": "gain with difficulty"}, {"w": "wrongheaded", "uk": "[ˈrɒŋhedɪd]", "us": "[ˈrɒŋhedɪd]", "cn": "固执己见的，坚持(错误观点的)", "pos": "adj.固执己见的，坚持(错误观点的)", "en": "stubborn in adherence"}];
let filteredWords = WORDS.map((w, i) => ({ ...w, idx: i }));
let highlightedIdx = -1;

const wordList = document.getElementById('wordList');
const searchInput = document.getElementById('searchInput');
const jumpInput = document.getElementById('jumpInput');
const stats = document.getElementById('stats');
const main = document.getElementById('main');
const alphaNav = document.getElementById('alphaNav');

const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
letters.forEach(l => {
  const btn = document.createElement('button');
  btn.textContent = l.toUpperCase();
  btn.onclick = () => {
    searchInput.value = l;
    filterWords(true);
    document.querySelectorAll('.alpha-nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  alphaNav.appendChild(btn);
});

function renderWords() {
  const fragment = document.createDocumentFragment();
  filteredWords.forEach((w, i) => {
    const div = document.createElement('div');
    div.className = 'word-item' + (i === highlightedIdx ? ' highlighted' : '');
    div.dataset.index = i;
    div.innerHTML = `
      <span class="word-index">${w.idx + 1}</span>
      <div>
        <div class="word-name">${w.w}</div>
      </div>
      <div class="word-phonetic">
        <div><span class="label">UK</span> ${w.uk}</div>
        <div><span class="label">US</span> ${w.us}</div>
      </div>
      <div>
        <div class="word-pos">${w.pos}</div>
      </div>
      <div class="word-en">${w.en}</div>
    `;
    div.onclick = () => {
      highlightedIdx = i;
      renderWords();
    };
    fragment.appendChild(div);
  });
  wordList.innerHTML = '';
  wordList.appendChild(fragment);
  stats.textContent = filteredWords.length + ' / ' + WORDS.length + ' words';
}

function filterWords(prefixOnly = false) {
  const query = searchInput.value.toLowerCase().trim();
  if (!query) {
    filteredWords = WORDS.map((w, i) => ({ ...w, idx: i }));
  } else {
    filteredWords = WORDS.map((w, i) => ({ ...w, idx: i })).filter(w =>
      prefixOnly ? w.w.toLowerCase().startsWith(query) : w.w.toLowerCase().includes(query)
    );
  }
  highlightedIdx = -1;
  renderWords();
  main.scrollTop = 0;
}

function jumpToIndex() {
  const idx = parseInt(jumpInput.value);
  if (idx >= 1 && idx <= WORDS.length) {
    searchInput.value = '';
    filteredWords = WORDS.map((w, i) => ({ ...w, idx: i }));
    highlightedIdx = idx - 1;
    renderWords();
    setTimeout(() => {
      const el = document.querySelector('.word-item.highlighted');
      if (el) el.scrollIntoView({ block: 'center' });
    }, 50);
  }
}

searchInput.addEventListener('input', filterWords);
jumpInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') jumpToIndex();
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput && document.activeElement !== jumpInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.value = '';
    jumpInput.value = '';
    document.querySelectorAll('.alpha-nav button').forEach(b => b.classList.remove('active'));
    filterWords();
    searchInput.blur();
  }
  if (document.activeElement === searchInput || document.activeElement === jumpInput) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIdx = Math.min(highlightedIdx + 1, filteredWords.length - 1);
    renderWords();
    const el = document.querySelector('.word-item.highlighted');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIdx = Math.max(highlightedIdx - 1, 0);
    renderWords();
    const el = document.querySelector('.word-item.highlighted');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'PageDown') {
    e.preventDefault();
    highlightedIdx = Math.min(highlightedIdx + 20, filteredWords.length - 1);
    renderWords();
    const el = document.querySelector('.word-item.highlighted');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'PageUp') {
    e.preventDefault();
    highlightedIdx = Math.max(highlightedIdx - 20, 0);
    renderWords();
    const el = document.querySelector('.word-item.highlighted');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
});

renderWords();
</script>
